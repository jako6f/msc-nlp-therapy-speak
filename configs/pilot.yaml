project:
  seed: 123
  out_dir: "data/interim/cc_pilot_stage_01b/iter_02"

pilot:
  crawl_ids:
    - "CC-MAIN-2016-44"
    - "CC-MAIN-2026-04"
    
## Common Crawl Nomenclature
# WARC files: full HTML source code
# WAT files: just metadata
# WET files: raw text data
sampling:
  wet_files_per_crawl: 2

filters:
  min_chars: 500
  domain_cap: 50
  asd_disambiguation_window_chars: 200
  context_window_chars: 200

boilerplate:
  enabled: true
  signature_patterns:
    - "skip\\s+to\\s+content"
    - "cookie\\s+consent"
    - "accept\\s+cookies?"
    - "manage\\s+cookies?"
    - "toggle\\s+navigation"
    - "accessibility\\s+widget"
    - "open\\s+accessibility\\s+menu"
    - "add\\s+to\\s+cart"
    - "\\bcheckout\\b"
    - "privacy\\s+policy.{0,80}cookies?"
  min_snippet_words: 8
  min_alpha_ratio: 0.45
  listiness_enabled: true
  listiness_phrases:
    - "more topics"
    - "browse all listings"
    - "resource center"
    - "categories"
    - "tags"
    - "topics"
    - "a-z"
    - "all conditions"
  listiness_thresholds:
    min_separator_density: 0.12
    max_sentence_punct: 1
    min_short_fragments: 4
    short_fragment_max_words: 3

terms:
  adhd_patterns:
    - "\\badhd\\b"
    - "attention[-\\s]?deficit"
  autism_patterns:
    - "\\bautism\\b"
    - "\\bautistic\\b"
    - "autism[-\\s]?spectrum"
  asd_pattern: "\\bASD\\b"
