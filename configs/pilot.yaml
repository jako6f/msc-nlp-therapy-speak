project:
  seed: 123 # base seed for deterministic sampling and validation sampling
  out_dir: "data/interim/cc_pilot_stage_01b/iter_07" # Stage 1b Iteration 07 outputs

pilot:
  crawl_ids:
    - "CC-MAIN-2016-44" # older crawl slice for temporal coverage
    - "CC-MAIN-2026-04" # newer crawl slice for temporal coverage
    
## Common Crawl Nomenclature
# WARC files: full HTML source code
# WAT files: just metadata
# WET files: raw text data
sampling:
  wet_files_per_crawl: 2 # sampled WET files per crawl_id for pilot scans

filters:
  min_chars: 500 # ignore very short WET docs before matching
  domain_cap: 50 # max retained hits per (crawl_id, registered_domain)
  asd_disambiguation_window_chars: 200 # window used only for ASD disambiguation
  context_window_chars: 200 # +/- chars captured around each match in context_snippet

boilerplate:
  enabled: true # master switch for snippet-level boilerplate filtering
  check_window_chars: 5000 # +/- chars used only for boilerplate checks around a match
  signature_hard_patterns: # single-hit hard signatures that immediately remove boilerplate
    - "skip\\s+to\\s+content"
    - "skip\\s+navigation"
    - "privacy\\s+policy.{0,80}cookies?"
    - "cookie\\s+consent"
    - "cookie\\s+settings"
    - "accept\\s+cookies?"
    - "manage\\s+cookies?"
    - "add\\s+to\\s+cart"
    - "\\bcheckout\\b"
    - "toggle\\s+navigation"
    - "open\\s+accessibility\\s+menu"
    - "accessibility\\s+widget"
    - "accessibility\\s+profile"
    - "choose\\s+accessibility\\s+menu"
    - "cognitive\\s+disability"
    - "seizure\\s+safe"
    - "reading\\s+mask"
    - "line\\s+height"
    - "cursor\\s+size"
    - "adhd[-\\s]?friendly\\s+(mode|profile)"
    - "accessibility\\s+tools?"
    - "high\\s+contrast"
    - "\\bcontrast\\b"
    - "screen\\s+reader"
    - "font\\s+size"
    - "text\\s+size"
    - "increase\\s+text"
    - "decrease\\s+text"
    - "enable\\s+.*"
    - "disable\\s+.*"
    - "barrierefreiheit"
    - "tillganglighet"
  topic_hub_enabled: true # enable generic topic-hub / browse page rule
  topic_hub_phrases: # generic topic-hub cues to avoid article-index fragments
    - "topics"
    - "browse"
    - "subscribe"
    - "rss"
    - "no articles match"
    - "more articles"
    - "see all articles"
    - "all articles"
    - "latest news"
    - "archives"
    - "categories"
    - "tagged"
    - "related articles"
    - "popular posts"
    - "site map"
    - "e-edition"
    - "edition"
    - "newsletter"
    - "all conditions"
    - "a-z"
  topic_hub_min_phrase_hits: 2 # minimum phrase hits before topic-hub removal
  topic_hub_max_sentence_punct: 1 # max sentence punctuation marks for topic-hub snippets
  directory_index:
    enabled: true # enable structural directory / conditions-index boilerplate rule
    lexicon: # generic index-like medical/category cues used as one score feature
      - "all conditions"
      - "conditions a-z"
      - "health a-z"
      - "browse conditions"
      - "symptoms"
      - "diagnosis"
      - "treatment"
      - "diseases"
      - "disorders"
      - "a to z"
      - "a-z index"
    score_threshold: 3 # minimum structure score to remove as directory-index
    min_separator_per_1k: 8.0 # minimum separator chars per 1k chars for list-like layout
    min_short_fragment_ratio: 0.35 # minimum ratio of short label-like fragments
    min_short_fragments: 8 # minimum count of short fragments to trust ratio signal
    short_fragment_min_chars: 3 # minimum chars for a short label fragment
    short_fragment_max_chars: 40 # maximum chars for a short label fragment
    max_sentence_terminators_per_1k: 2.5 # low narrative signal threshold (terminators per 1k chars)
    low_narrative_min_separator_per_1k: 6.0 # min separator density required to apply low-narrative boost
    min_lexicon_hits: 2 # minimum lexicon hits to score lexical directory signal
    min_capitalized_token_ratio: 0.22 # minimum title-case token ratio for noun-list signal

terms:
  adhd_patterns:
    - "\\badhd\\b"
    - "attention[-\\s]?deficit"
  autism_patterns:
    - "\\bautism\\b"
    - "\\bautistic\\b"
    - "autism[-\\s]?spectrum"
  asd_pattern: "\\bASD\\b"
