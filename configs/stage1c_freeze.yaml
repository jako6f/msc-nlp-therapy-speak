project:
  seed: 123

paths:
  interim_base: "data/interim"
  stage1_base: "data/interim/stage1_pilot-dev"

run_context:
  stage: "stage1c"
  track: "stage1_pilot-dev"

pilot:
  crawl_ids:
    - "CC-MAIN-2016-44"
    - "CC-MAIN-2026-04"

sampling:
  wet_files_per_crawl: 2

filters:
  min_chars: 500
  domain_cap: 50
  asd_disambiguation_window_chars: 200
  context_window_chars: 200

boilerplate:
  enabled: true
  check_window_chars: 2000
  signature_hard_patterns:
    - "skip\\s+to\\s+content"
    - "skip\\s+navigation"
    - "privacy\\s+policy.{0,80}cookies?"
    - "cookie\\s+consent"
    - "cookie\\s+settings"
    - "accept\\s+cookies?"
    - "manage\\s+cookies?"
    - "add\\s+to\\s+cart"
    - "\\bcheckout\\b"
    - "toggle\\s+navigation"
    - "open\\s+accessibility\\s+menu"
    - "accessibility\\s+widget"
    - "accessibility\\s+profile"
    - "choose\\s+accessibility\\s+menu"
    - "cognitive\\s+disability"
    - "seizure\\s+safe"
    - "reading\\s+mask"
    - "line\\s+height"
    - "cursor\\s+size"
    - "adhd[-\\s]?friendly\\s+(mode|profile)"
  directory_index:
    enabled: true
    lexicon:
      - "all conditions"
      - "conditions a-z"
      - "health a-z"
      - "browse conditions"
      - "symptoms"
      - "diagnosis"
      - "treatment"
      - "diseases"
      - "disorders"
      - "a to z"
      - "a-z index"
    score_threshold: 4
    min_separator_per_1k: 10.0
    min_short_fragment_ratio: 0.45
    min_short_fragments: 10
    short_fragment_min_chars: 3
    short_fragment_max_chars: 35
    max_sentence_terminators_per_1k: 2.5
    low_narrative_min_separator_per_1k: 8.0
    min_lexicon_hits: 3
    min_capitalized_token_ratio: 0.3
    min_single_letter_tokens: 6

terms:
  adhd_patterns:
    - name: "adhd"
      pattern: "\\badhd\\b"
    - name: "attention_deficit"
      pattern: "attention[-\\s]?deficit"
  autism_patterns:
    - name: "autism"
      pattern: "\\bautism\\b"
    - name: "autistic"
      pattern: "\\bautistic\\b"
    - name: "autism_spectrum"
      pattern: "autism[-\\s]?spectrum"
  asd_pattern:
    name: "asd"
    pattern: "\\bASD\\b"
  baseline_patterns:
    - name: "frustration"
      pattern: "\\bfrustration\\b"
    - name: "sadness"
      pattern: "\\bsadness\\b"
    - name: "loneliness"
      pattern: "\\bloneliness\\b"
