#:schema https://developers.openai.com/codex/config-schema.json

# Safe default: Codex may edit this repo, but not the whole machine.
sandbox_mode = "workspace-write"

# Let Codex decide when escalation is genuinely needed.
# Values: untrusted | on-failure | on-request | never
approval_policy = "on-request"

# Keep shell/network operations explicit. Do not let installs/downloads happen silently.
sandbox_workspace_write.network_access = false

# More research-capable default.
# Values: disabled | cached | live
web_search = "live"
